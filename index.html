<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Atrapa el Cuadrado PRO</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Atrapa el Cuadrado PRO</h1>

<!-- PANEL DE OPCIONES -->
<div id="options">
  <h3>Opciones</h3>
  Nombre:
  <input id="playerName" placeholder="Jugador">
  <br>
  <label><input type="checkbox" id="musicToggle" checked> Música</label>
  <label><input type="checkbox" id="vibrationToggle" checked> Vibración</label>
</div>

<!-- PANEL MODOS -->
<div id="modes">
  <select id="mode">
    <option value="easy">Fácil</option>
    <option value="normal">Normal</option>
    <option value="hard">Difícil</option>
    <option value="nightmare" disabled>Pesadilla 🔒</option>
    <option value="hide">Escondidas</option>
  </select>
  <button id="startBtn">Jugar</button>
  <button id="exitBtn">Salir</button>
</div>

<p>
  Puntos/Fase: <span id="score">0</span> |
  Récord: <span id="record">0</span>
</p>

<div id="gameArea"></div>

<p id="message"></p>

<!-- TOP RÉCORDS -->
<div id="topPanel">
  <h3>🏆 Top Récords</h3>
  <select id="topMode"></select>
  <ol id="topList"></ol>
</div>

<script src="game.js"></script>
</body>
</html>
